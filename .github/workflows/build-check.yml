name: Build Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-noble:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt build-dep -y mesa
          sudo apt install -y git ccache libxfixes-dev libarchive-dev

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-runner-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone repository
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone --depth 1 --single-branch --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" mesa-for-android-container

      - name: Set release name suffix
        shell: bash
        run: |
          cd ~/mesa-for-android-container
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          short_hash=$(git rev-parse --short HEAD)
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${short_hash}_ubuntu_noble_arm64" >> "$GITHUB_ENV"

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=~/.ccache
          export LLVM_CONFIG=/usr/lib/llvm-20/bin/llvm-config
          echo "Building Mesa..."
          cd ~/mesa-for-android-container
          meson setup build/ \
            --prefix=/usr \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,virgl,llvmpipe \
            -Dgallium-va=enabled \
            -Dtermux-va-bridge=enabled \
            -Dtermux-va-wayland-shim=enabled \
            -Dvideo-codecs=all \
            -Dgallium-mediafoundation=disabled \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-layers= \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglvnd=enabled \
            -Dglx=dri \
            -Dlibunwind=disabled \
            -Dintel-rt=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dgles1=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build/
          echo "Mesa build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Mesa
        shell: bash
        run: |
          echo "Packaging Mesa..."
          cd ~/mesa-for-android-container
          sudo mkdir /tmp/mesa-install-tmp
          sudo DESTDIR=/tmp/mesa-install-tmp meson install -C build/
          sudo tar -zcvf mesa_${MESA_RELEASE_NAME_SUFFIX}.tar.gz -C /tmp/mesa-install-tmp .
          sudo chown "$USER:$(id -gn)" mesa_${MESA_RELEASE_NAME_SUFFIX}.tar.gz
          chmod 644 mesa_${MESA_RELEASE_NAME_SUFFIX}.tar.gz
          sudo rm -rf /tmp/mesa-install-tmp
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.tar.gz" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesa_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
            ~/mesa-for-android-container/*.tar.gz
            ~/mesa-for-android-container/sha256sums.txt
          retention-days: 90

  ubuntu-resolute:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:resolute
      options: --privileged --user root

    steps:
